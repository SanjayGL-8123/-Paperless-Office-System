<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Paperless Office System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🌿 Paperless Office System</h1>
    <p>Reduce paper. Save trees. Work digitally.</p>

    <div class="container">
        <input type="text" id="fileName" placeholder="Enter document name">
        <textarea id="fileNote" placeholder="Enter document note"></textarea>
        <button onclick="saveFile()">Save Document</button>
    </div>

    <h2>📂 Stored Documents</h2>
    <ul id="fileList"></ul>

    <script src="script.js"></script>
</body>

</html>
